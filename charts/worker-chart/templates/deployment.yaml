# This file contains the Kubernetes Deployment and Service for the worker application.
# It is configured to deploy desire set of replica of the application and expose it via a Service.

apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}

---

apiVersion: apps/v1
kind: Deployment
# Metadata for the Deployment object
metadata:
  name: worker-deployment
  namespace: {{ .Values.namespace }} # required to change by Helm values
  labels:
    app: worker-app
# Specification of the desired behavior of the Deployment
spec:
  replicas: {{ .Values.replicaCount }} # Needed to change by Helm values
  # Label selector for pods managed by this deployment
  selector: 
    matchLabels:
      app: worker-app
  # Template for the pods managed by this deployment
  template:
    metadata:
      # Labels to be applied to the pods
      labels:
        app: worker-app
    # Specification of the pod's contents
    spec:
      # Affinity rules to spread pods across zones
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: worker-app
      containers:
      - name: worker-app-container
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }} # Needed to change by Helm values
        # imagePullSecrets:
        # - name: aws-ecr-secret
        # to always pull the latest image, useful during development
        imagePullPolicy: Always
        ports:
        - containerPort: 80 # The port that the container listens on
        # Defines rediness probe for a pod
        # This will try to connect with application on port 80
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        # Defines liveness probe for a pod
        # Try to connect with application on port 80.
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10        
        envFrom:
        - configMapRef:
            name: {{ .Values.configMap.name }} # Reference to a ConfigMap named "worker-config"
        - secretRef:
            name: worker-secrets # Reference to a secret named "worker-secrets"
        resources:
          limits:
            memory: "{{ .Values.resources.limits.memory }}"
            cpu: "{{ .Values.resources.limits.cpu }}"
          requests:
            memory: "{{ .Values.resources.requests.memory }}"
            cpu: "{{ .Values.resources.requests.cpu }}"

---

apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: worker-secrets
  namespace: {{ .Values.namespace }}
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  POSTGRES_DB: cG9zdGdyZXM=

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Values.namespace }} 
data:
  POSTGRES_DB_HOSTNAME: "{{ .Values.configMap.data.POSTGRES_DB_HOSTNAME }}"
  REDIS_HOSTNAME: "{{ .Values.configMap.data.REDIS_HOSTNAME }}"  