# Default values for db-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information 
# can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/

# Name of the Kubernetes Namespace where resources will be deployed
namespace: db-ns

# This sets the maxSkew for topology spread constraints 
# more information can be found here: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
maxSkew: 1

# This sets the number of replicas for the Deployment
replicaCount: 1


# This sets the container image more information can be found   
# here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: postgres
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "15-alpine"

# This is for setting up the environment variables from
# secrets: postgres-secrets

#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found 
  # here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found 
  # here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 5432

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: "500m"
    memory: "128Mi"
  requests:
    cpu: "250m"
    memory: "64Mi"

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# This is for setting up Persistent Volume Claims more information can be found 
# here: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
StorageClass:
  name: ebs-db-sc
  type: gp3
  iopsPerGB: "10"
  encrypted: "true"
  zone1: us-east-1a
  zone2: us-east-1b

persistentVolumeClaim:
  name: pvc-ebs-db
  # The storage class to use to provision the volume.
  # If not set, the default storage class will be used (if one is available).
  storageClassName: ebs-db-sc
  # The access modes for the volume. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
  accessModes:
    - ReadWriteOnce
  # The size of the volume. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#resources
  storage: 2Gi