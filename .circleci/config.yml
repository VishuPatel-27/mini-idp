version: 2.1

# define this file as the setup phase of your dynamic configuration
setup: true

# use the path-filtering orb to continue a pipeline based on
# the path of an updated set of files
orbs:
  path-filtering: circleci/path-filtering@2.0.4

workflows:
  always-run:
    jobs:
      # the path-filtering/filter job determines which pipeline
      # parameters to update.
      - path-filtering/filter:
          name: check-updated-files-in-vote-app
          # <regex path-to-test> <parameter-to-set> <value-of-pipeline-parameter>
          mapping: |
            apps/vote/.* run-vote-app-job true
            ^\./vote-config\.yaml$ run-vote-app-job true
          base-revision: main
          # this is the path of the configuration we should trigger once
          # path filtering and pipeline parameter value updates are
          # complete.
          config-path: .circleci/vote-config.yml
      
      -  path-filtering/filter:
          name: check-updated-files-in-worker-app
          # <regex path-to-test> <parameter-to-set> <value-of-pipeline-parameter>
          mapping: |
            apps/worker/.* run-worker-app-job true
            ^\./worker-config\.yaml$ run-worker-app-job true
          base-revision: main
          # this is the path of the configuration we should trigger once
          # path filtering and pipeline parameter value updates are
          # complete.
          config-path: .circleci/worker-config.yml
      
      - path-filtering/filter:
          name: check-updated-files-in-result-app
          # <regex path-to-test> <parameter-to-set> <value-of-pipeline-parameter>
          mapping: |
            apps/result/.* run-result-app-job true
            ^\./result-config\.yaml$ run-result-app-job true
          base-revision: main
          # this is the path of the configuration we should trigger once
          # path filtering and pipeline parameter value updates are
          # complete.
          config-path: .circleci/result-config.yml
