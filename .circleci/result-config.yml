version: 2.1

setup: true
parameters:
  run-result-app-job:
    type: boolean
    default: false
  workingdir:
    type: string
    # default working directory is mini-idp/apps/result/
    default: "./apps/result/"
    
# Orbs is a shareable, reusable package of configuration elements (like jobs, commands, and executors) 
# that simplifies and standardizes CI/CD pipelines
orbs:
  docker: circleci/docker@3.0.1
  slack: circleci/slack@6.0.0

jobs:

  # In this stage will checkout the source code and perform
  # testing on it.
  # Have used the python docker image as executer
  checkout_and_test:

    docker:
      - image: cimg/node:20.19
    
    steps:

        # checkout source code
      - checkout
        
        # Restore pip chache
      - restore_cache:
          name: Restoring cache of result application if its exist
          key: 
            - result-app-{{ checksum "package-lock.json" }}
     
        # install dependencies
      - run:
          name: Installing dependencies
          command: |
            npm install
        
        # saving cache for better performance
      - save_cache: 
          name: saving cache of result application dependencies
          key: result-app-{{ checksum "package-lock.json" }}
          paths: ~/project/node_modules

        # Will perform unit test here

  build_and_push:
    
    executor: docker/docker
    
    steps:
    
      # checkout a source code
      - checkout 
      
      # Enable remote docker with caching
      - setup_remote_docker:
          version: 20.10.18
          docker_layer_caching: true
      
      # Building Docker image
      - run:
          name: Building docker image
          command: |
            docker build -t imv27/result-app:${$CIRCLE_BUILD_NUM} .
      
      # Running smoke test on docker image
      - run: 
          name: Smoke testing on docker image
          command: |
            mkdir -p smoke-test-results
            docker run -d -p 80:80 --name result-smoke-test imv27/result-app:${$CIRCLE_BUILD_NUM}
      
      # Varifying smoke result
      - run:
          name: Wait for app readiness
          command: |
            for i in {1..10}; do
              if curl -s http://localhost:80/ > /dev/null; then
                echo "App is ready"
                exit 0
              fi
              sleep 2
            done
            echo "App failed to start"
            exit 1
      
      # Cleanup
      - run: 
         name: Removing docker containers
         command: |
            docker stop result-smoke-test
            docker rm result-smoke-test
      
      # upload and store test results for a build
      - store_test_results: 
          path: smoke-test-results
      
      - run: 
         name: Pushing docker image to ECR repo
         command: |
            docker push imv27/result-app:${$CIRCLE_BUILD_NUM}

  # Sending slack notification of results
  # create a PR request on main branch
  notify_and_PR_request:
    docker:
      - image: cimg/base:current
    steps: 
      - slack/notify:
          event: pass
          template: basic_success_1

workflows:
  result-app-Workflow:
    when: << pipeline.parameters.run-result-app-job >>
    jobs:
      - checkout_and_test:
          filters:
            branches:
              only: feature/implementation-of-application   # runs on all feature/* branches
      - build_and_push:
          filters:
            branches:
              only: feature/implementation-of-application
          requires:
            - checkout_and_test
      - notify_and_PR_request:
          context: slack-secrets
          filters:
            branches:
              only: feature/implementation-of-application
          requires:
            - build_and_push